name: Notes
options:
  bundleIdPrefix: com.kobosh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.5.0
  WKMarkdownView:
    url: https://github.com/weihas/WKMarkdownView.git
    from: 1.3.1

targets:
  Notes:
    type: application
    platform: iOS
    sources:
      - path: Notes
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: WKMarkdownView
        product: WKMarkdownView
    info:
      path: Notes/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Notes
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "Notes uses your microphone to record audio for AI transcription and study guide generation."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kobosh.notes
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L8K7C9GMH
        CODE_SIGN_ENTITLEMENTS: Notes/Notes.entitlements
