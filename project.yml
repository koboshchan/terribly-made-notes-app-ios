name: Notes
options:
  bundleIdPrefix: com.kobosh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

schemes:
  Notes:
    build:
      targets:
        Notes: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  NotesSharingTests:
    build:
      targets:
        Notes: all
        NotesSharingHost: all
    test:
      targets:
        - NotesTests
        - NotesSharingUITests

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.5.0
  WKMarkdownView:
    url: https://github.com/weihas/WKMarkdownView.git
    from: 1.3.1

targets:
  Notes:
    type: application
    platform: iOS
    sources:
      - path: Notes
      - path: Notes.icon
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: WKMarkdownView
        product: WKMarkdownView
      - target: NotesShare
        embed: true
    info:
      path: Notes/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Notes
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "Notes uses your microphone to record audio for AI transcription and study guide generation."
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kobosh.notes
        ASSETCATALOG_COMPILER_APPICON_NAME: Notes
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L8K7C9GMH
        CODE_SIGN_ENTITLEMENTS: Notes/Notes.entitlements

  NotesShare:
    type: app-extension
    platform: iOS
    sources:
      - path: NotesShare
    info:
      path: NotesShare/Info.plist
      properties:
        CFBundleDisplayName: Notes
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.kobosh.notes.share
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L8K7C9GMH
        CODE_SIGN_ENTITLEMENTS: NotesShare/NotesShare.entitlements

  NotesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NotesTests]
    dependencies:
      - target: Notes
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true

  NotesSharingHost:
    type: application
    platform: iOS
    sources:
      - path: Tests/SharingHost
      - path: Notes/Models/Note.swift
      - path: Notes/Models/NoteShareInfo.swift
      - path: Notes/Models/NoteSharingModel.swift
      - path: Notes/Models/NoteMarkdownExport.swift
      - path: Notes/Views/NoteShareView.swift
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.kobosh.notes.sharing-test-host
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: true

  NotesSharingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NotesUITests]
    dependencies:
      - target: NotesSharingHost
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
